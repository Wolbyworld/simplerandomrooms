name: Deploy to server-elcano

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: randomenumbers-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, Linux, X64, randomenumbers]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Deploy with rollback
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          previous_container="$(docker compose ps -q app)"
          previous_image=""
          if [ -n "$previous_container" ]; then
            previous_image="$(docker inspect --format '{{.Config.Image}}' "$previous_container")"
          fi

          docker compose build app
          docker compose up -d --no-build --remove-orphans app

          if ! curl --fail --silent --show-error --retry 10 --retry-delay 2 http://127.0.0.1:3900/health; then
            if [[ "$previous_image" == randomenumbers:* ]]; then
              previous_tag="${previous_image#randomenumbers:}"
              IMAGE_TAG="$previous_tag" docker compose up -d --no-build app
              curl --fail --silent --show-error --retry 10 --retry-delay 2 http://127.0.0.1:3900/health
            else
              docker compose down
            fi
            exit 1
          fi

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/random_draw.db
    ports:
      - "127.0.0.1:3900:8000"
    volumes:
      - app-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:

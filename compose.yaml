services:
  app:
    image: randomenumbers:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        if [ ! -f /data/random_draw.db ]; then
          cp /app/random_draw.db.backup /data/random_draw.db;
        fi;
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      DATABASE_URL: sqlite:////data/random_draw.db
    ports:
      - "127.0.0.1:3900:8000"
    volumes:
      - app-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:
